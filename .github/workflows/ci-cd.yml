name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install Frontend Dependencies
      working-directory: ./Frontend/medical-travel-app
      run: npm ci
    
    - name: Build Frontend
      working-directory: ./Frontend/medical-travel-app
      run: npm run build
    
    - name: Lint Frontend
      working-directory: ./Frontend/medical-travel-app
      run: npm run lint

  build-docker-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        service: [UserService, ProviderService, ApiGateway]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        build-args: |
          SERVICE_NAME=${{ matrix.service }}
        tags: ${{ secrets.DOCKER_USERNAME }}/medicaltravel-${{ matrix.service }}:latest

  deploy-to-azure:
    needs: build-docker-images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'medicaltravel-api'
        images: '${{ secrets.DOCKER_USERNAME }}/medicaltravel-userservice:latest'
    
    - name: Deploy Azure Functions
      uses: Azure/functions-action@v1
      with:
        app-name: 'medicaltravel-functions'
        package: './Functions/UserServiceFunction'
